# enemy_color: "red"
enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.4
use_traditional: false

#####-----ROI-----#####
roi: 
  x: 312
  y: 300
  width: 1000
  height: 800

use_roi: true

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
# yaw_offset: 0 # degree -2.5
# pitch_offset: 6.5 # degree 2
yaw_offset: 9.178 # degree 17
pitch_offset: 0.0 # degree 2.9
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 5 # rad/s
high_speed_delay_time: 0.0 # s
low_speed_delay_time: 0.2 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 10
gain: 22
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 相机内参 (来自dhzzb项目)
# image_width: 1280, image_height: 1024
camera_matrix: [1774.6, 0, 807.3595, 0, 1781.0, 622.1149, 0, 0, 1]
distort_coeffs: [-0.0704, 0.1279, 0, 0, 0]
R_camera2gimbal: [0.997511512625987, -0.0003575183448173363, -0.0223048812985224, -0.00012709225808083384, 0.9997640531430503, -0.02172146151938448, 0.022307384352860525, 0.021718890938841325, 0.9995152176829127]
t_camera2gimbal: [0.014599739652442417, 0.013958201927723914, 0.004943618423290939]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s
frame_rate: 30
