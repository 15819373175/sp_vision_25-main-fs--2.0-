# RoboMaster 装甲板关键点检测数据集配置
# 任务: Pose Estimation  关键点: 4角点 (TL, BL, BR, TR)
# 类别矩阵: 4色(B/R/N/P) × 9型(G/1/2/3/4/5/O/Bs/Bb) = 36类

path: D:/MyCode/YOLO26/dataset
train: images/train
val:   images/val

nc: 36
names:
  0:  BG    # 蓝-哨兵
  1:  B1    # 蓝-1号
  2:  B2    # 蓝-2号
  3:  B3    # 蓝-3号
  4:  B4    # 蓝-4号
  5:  B5    # 蓝-5号
  6:  BO    # 蓝-前哨站
  7:  BBs   # 蓝-基地
  8:  BBb   # 蓝-基地大装甲
  9:  RG    # 红-哨兵
  10: R1    # 红-1号
  11: R2    # 红-2号
  12: R3    # 红-3号
  13: R4    # 红-4号
  14: R5    # 红-5号
  15: RO    # 红-前哨站
  16: RBs   # 红-基地
  17: RBb   # 红-基地大装甲
  18: NG    # 熄灭-哨兵
  19: N1    # 熄灭-1号
  20: N2    # 熄灭-2号
  21: N3    # 熄灭-3号
  22: N4    # 熄灭-4号
  23: N5    # 熄灭-5号
  24: NO    # 熄灭-前哨站
  25: NBs   # 熄灭-基地
  26: NBb   # 熄灭-基地大装甲
  27: PG    # 紫-哨兵
  28: P1    # 紫-1号
  29: P2    # 紫-2号
  30: P3    # 紫-3号
  31: P4    # 紫-4号
  32: P5    # 紫-5号
  33: PO    # 紫-前哨站
  34: PBs   # 紫-基地
  35: PBb   # 紫-基地大装甲

# 关键点配置: 4点 × (x, y, visibility)
kpt_shape: [4, 3]

# 水平翻转时关键点对称映射: TL<->TR, BL<->BR
# 原顺序 [TL, BL, BR, TR] -> 翻转后 [TR, BR, BL, TL] -> 索引 [3, 2, 1, 0]
flip_idx: [3, 2, 1, 0]
